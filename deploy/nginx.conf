server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Estro loads no third-party code and talks to no origin but its own, so the policy can be
  # as tight as the platform allows. 'wasm-unsafe-eval' is for the MP3 encoder, which is
  # compiled JavaScript running in the page; blob: is for the object URLs the decoder and the
  # export path create from the user's own files.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' blob: data:; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  # Estro never asks for a camera or a location. Voice-over needs the microphone, and only
  # from this origin.
  add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), interest-cohort=()" always;
  # Nothing is uploaded, so there is nothing an embedding page should be able to read.
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types
    text/plain text/css text/javascript
    application/javascript application/json application/manifest+json
    application/wasm image/svg+xml;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "healthy\n";
  }

  # The shell names the hashed asset files, so caching it would pin a browser to a build that
  # no longer exists. It must be revalidated every time; the assets under it never are.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # Hashed filenames, so a year is safe and a rebuild produces new names rather than stale
  # hits. Scoped to the build output rather than to every path with these extensions.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
  }

  # A single-page application: every unknown path is a route, not a missing file.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
