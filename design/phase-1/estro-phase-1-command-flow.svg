<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">Estro Phase 1 command and recovery flow</title>
  <desc id="description">A detailed dark interface board showing how a WebMCP project change is inspected, proposed, validated, confirmed, committed, summarized, recovered, and undone through the same visible Estro command model.</desc>

  <defs>
    <linearGradient id="agent-edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#56a8ff"/>
      <stop offset="0.58" stop-color="#747df4"/>
      <stop offset="1" stop-color="#a17df2"/>
    </linearGradient>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 3 1.4 5.6L19 10l-5.6 1.4L12 17l-1.4-5.6L5 10l5.6-1.4z"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2.5 20h19zM12 9v5M12 17h.01"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 7 4 12l5 5M5 12h8a6 6 0 0 1 6 6"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6l4 2"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M14 7l5 5-5 5"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v5h5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  </defs>

  <style>
    text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .heading { fill: #f1f3f7; font-size: 14px; font-weight: 620; }
    .label { fill: #e4e7ec; font-size: 11px; font-weight: 560; }
    .body { fill: #adb3be; font-size: 10px; font-weight: 400; }
    .meta { fill: #7f8794; font-size: 9px; font-weight: 500; }
    .micro { fill: #69717e; font-size: 8px; font-weight: 650; letter-spacing: .8px; }
    .value { fill: #aab2bf; font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 9px; font-variant-numeric: tabular-nums; }
    .icon { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .divider { stroke: #292d35; stroke-width: 1; shape-rendering: crispEdges; }
  </style>

  <rect width="1440" height="900" fill="#0d0f13"/>
  <text x="40" y="34" fill="#f5f6f9" font-size="17" font-weight="650" text-anchor="start">Estro</text>
  <text x="40" y="66" fill="#eef1f5" font-size="24" font-weight="620" letter-spacing="-.35" text-anchor="start">Phase 1 · One command, one honest history</text>
  <text x="40" y="88" class="body" font-size="11" text-anchor="start">UI and WebMCP share validation, transaction identity, visible consequence, durability, and Undo.</text>
  <text x="1400" y="36" class="micro" text-anchor="end">PHASE 1 · INTERACTION CONTRACT</text>

  <!-- Flow spine -->
  <rect x="40" y="108" width="1360" height="44" rx="8" fill="#111318" stroke="#292d35"/>
  <circle cx="76" cy="130" r="9" fill="#244766" stroke="#5ba7e9"/><text x="76" y="133" fill="#eaf4fd" font-size="9" font-weight="700" text-anchor="middle">1</text>
  <text x="94" y="134" class="label">Inspect</text>
  <g color="#59616d" class="icon"><use href="#i-arrow" x="184" y="122" width="16" height="16"/></g>
  <circle cx="246" cy="130" r="9" fill="#3f3d68" stroke="#8982e7"/><text x="246" y="133" fill="#f0edff" font-size="9" font-weight="700" text-anchor="middle">2</text>
  <text x="264" y="134" class="label">Propose</text>
  <g color="#59616d" class="icon"><use href="#i-arrow" x="366" y="122" width="16" height="16"/></g>
  <circle cx="428" cy="130" r="9" fill="#4c3d23" stroke="#e4b456"/><text x="428" y="133" fill="#fff0cc" font-size="9" font-weight="700" text-anchor="middle">3</text>
  <text x="446" y="134" class="label">Validate / confirm</text>
  <g color="#59616d" class="icon"><use href="#i-arrow" x="592" y="122" width="16" height="16"/></g>
  <circle cx="654" cy="130" r="9" fill="#245044" stroke="#68caa6"/><text x="654" y="133" fill="#e4fff5" font-size="9" font-weight="700" text-anchor="middle">4</text>
  <text x="672" y="134" class="label">Commit</text>
  <g color="#59616d" class="icon"><use href="#i-arrow" x="758" y="122" width="16" height="16"/></g>
  <circle cx="820" cy="130" r="9" fill="#245044" stroke="#68caa6"/><text x="820" y="133" fill="#e4fff5" font-size="9" font-weight="700" text-anchor="middle">5</text>
  <text x="838" y="134" class="label">Explain</text>
  <g color="#59616d" class="icon"><use href="#i-arrow" x="930" y="122" width="16" height="16"/></g>
  <circle cx="992" cy="130" r="9" fill="#244766" stroke="#5ba7e9"/><text x="992" y="133" fill="#eaf4fd" font-size="9" font-weight="700" text-anchor="middle">6</text>
  <text x="1010" y="134" class="label">Undo / recover</text>
  <text x="1376" y="134" class="value" text-anchor="end">revision 18 → 19 → 20</text>

  <!-- 01 Inspect -->
  <text x="40" y="181" class="micro">01 · BOUNDED INSPECTION</text>
  <rect x="40" y="194" width="660" height="278" rx="9" fill="#111318" stroke="#30343d"/>
  <rect x="40" y="194" width="660" height="42" rx="9" fill="#16181d"/><rect x="40" y="227" width="660" height="9" fill="#16181d"/>
  <line x1="40" y1="235.5" x2="700" y2="235.5" class="divider"/>
  <text x="58" y="220" class="heading">Anniversary film</text><text x="176" y="220" class="value">Revision 18</text>
  <rect x="420" y="202" width="214" height="26" rx="13" fill="#1b1e25" stroke="url(#agent-edge)"/>
  <g color="#78b8fa" class="icon"><use href="#i-eye" x="432" y="208" width="14" height="14"/></g>
  <text x="454" y="219" class="label">Inspecting project history</text>
  <circle cx="650" cy="215" r="2" fill="#5ea9ec"/><circle cx="658" cy="215" r="2" fill="#787fea"/><circle cx="666" cy="215" r="2" fill="#9e7cec"/>
  <rect x="56" y="254" width="394" height="196" rx="7" fill="#14171c" stroke="#292e36"/>
  <text x="74" y="282" class="micro">PROJECT STATE</text>
  <text x="74" y="310" class="body">Name</text><text x="430" y="310" class="label" text-anchor="end">Anniversary film</text>
  <text x="74" y="338" class="body">Head revision</text><text x="430" y="338" class="value" text-anchor="end">rev_18</text>
  <text x="74" y="366" class="body">Last durable save</text><text x="430" y="366" class="label" text-anchor="end">3 minutes ago</text>
  <text x="74" y="394" class="body">Undo available</text><text x="430" y="394" fill="#8fdabc" font-size="10" text-anchor="end">Yes · tx_8N4P</text>
  <text x="74" y="422" class="body">Storage</text><text x="430" y="422" class="label" text-anchor="end">Local browser</text>
  <rect x="468" y="254" width="214" height="196" rx="7" fill="#12151a" stroke="#292e36"/>
  <text x="486" y="282" class="micro">TOOL RESULT</text>
  <text x="486" y="310" class="value">project_id  project_7H2K</text>
  <text x="486" y="332" class="value">schema      estro.project/1</text>
  <text x="486" y="354" class="value">revision    rev_18</text>
  <text x="486" y="376" class="value">selector    summary</text>
  <text x="486" y="406" class="meta">No binary media returned.</text>
  <text x="486" y="423" class="meta">No project state changed.</text>

  <!-- 02 Proposal -->
  <text x="732" y="181" class="micro">02 · TRANSACTION PROPOSAL</text>
  <rect x="732" y="194" width="668" height="278" rx="9" fill="#111318" stroke="#30343d"/>
  <rect x="750" y="212" width="632" height="242" rx="8" fill="#171a20" stroke="url(#agent-edge)" stroke-width="1.1"/>
  <g color="#8abdf2" class="icon"><use href="#i-spark" x="770" y="230" width="18" height="18"/></g>
  <text x="800" y="241" class="heading">Project cleanup is ready to review</text>
  <text x="800" y="261" class="body">2 ordered changes · Source revision 18 · No changes made yet</text>
  <rect x="770" y="282" width="592" height="54" rx="6" fill="#1d2026"/>
  <circle cx="790" cy="309" r="10" fill="#274865"/><text x="790" y="312" fill="#dcefff" font-size="9" font-weight="700" text-anchor="middle">1</text>
  <text x="811" y="304" class="label">Rename project</text><text x="811" y="320" class="meta">“Anniversary film” → “25th Anniversary”</text>
  <rect x="770" y="344" width="592" height="54" rx="6" fill="#1d2026"/>
  <circle cx="790" cy="371" r="10" fill="#403d69"/><text x="790" y="374" fill="#efeaff" font-size="9" font-weight="700" text-anchor="middle">2</text>
  <text x="811" y="366" class="label">Create named snapshot</text><text x="811" y="382" class="meta">“Before anniversary assembly”</text>
  <g color="#70d2ac" class="icon"><use href="#i-check" x="770" y="414" width="14" height="14"/></g>
  <text x="792" y="425" fill="#8fdabc" font-size="9">Valid · reversible as one transaction</text>
  <text x="1210" y="425" class="value" text-anchor="end">proposal_3F6D · 4:52</text>
  <rect x="1223" y="410" width="59" height="30" rx="6" fill="#24272e" stroke="#343943"/><text x="1252" y="429" class="label" text-anchor="middle">Reject</text>
  <rect x="1290" y="410" width="72" height="30" rx="6" fill="#5ca7ed"/><text x="1326" y="429" fill="#08111c" font-size="10" font-weight="680" text-anchor="middle">Apply</text>

  <!-- 03 Validation and confirmation -->
  <text x="40" y="505" class="micro">03 · ERRORS AND MEANINGFUL CONFIRMATION</text>
  <rect x="40" y="518" width="660" height="276" rx="9" fill="#111318" stroke="#30343d"/>
  <rect x="58" y="538" width="624" height="94" rx="8" fill="#1b1719" stroke="#57383e"/>
  <g color="#ed7a88" class="icon"><use href="#i-alert" x="76" y="557" width="18" height="18"/></g>
  <text x="106" y="568" fill="#f0e7e9" font-size="12" font-weight="620">The proposal is based on an older revision</text>
  <text x="106" y="590" class="body">Expected revision 18, but revision 19 is now active. Your project was not changed.</text>
  <text x="106" y="612" class="value">STALE_REVISION · sourceRevisionId</text>
  <rect x="544" y="588" width="116" height="30" rx="6" fill="#252932" stroke="#39414b"/><text x="602" y="607" class="label" text-anchor="middle">Review latest</text>

  <rect x="58" y="650" width="624" height="124" rx="8" fill="#181a1f" stroke="#414751"/>
  <g color="#e7b85e" class="icon"><use href="#i-lock" x="76" y="670" width="18" height="18"/></g>
  <text x="106" y="680" class="heading">Delete “Coastal reel”?</text>
  <text x="106" y="702" class="body">This removes the local project and its 11 revisions from this browser.</text>
  <text x="106" y="721" class="body">No media will be uploaded or shared. This action cannot be undone.</text>
  <text x="106" y="746" class="value">project_4C9A · 8.7 MB · destructive</text>
  <rect x="523" y="728" width="65" height="32" rx="6" fill="#252932" stroke="#39414b"/><text x="555" y="748" class="label" text-anchor="middle">Cancel</text>
  <rect x="596" y="728" width="64" height="32" rx="6" fill="#2a1c20" stroke="#713a44"/><text x="628" y="748" fill="#ef929c" font-size="10" font-weight="620" text-anchor="middle">Delete</text>

  <!-- 04 Complete, Undo, Recovery -->
  <text x="732" y="505" class="micro">04 · DURABLE RESULT, UNDO, AND RECOVERY</text>
  <rect x="732" y="518" width="668" height="276" rx="9" fill="#111318" stroke="#30343d"/>
  <rect x="750" y="538" width="632" height="96" rx="8" fill="#17201d" stroke="#315147"/>
  <circle cx="778" cy="566" r="14" fill="#1d4237"/><g color="#70d2ac" class="icon"><use href="#i-check" x="770" y="558" width="16" height="16"/></g>
  <text x="804" y="562" class="heading">Project cleanup complete</text>
  <text x="804" y="582" class="body">Renamed the project and saved “Before anniversary assembly”.</text>
  <text x="804" y="604" class="value">tx_9Q2M · Revision 19 · Agent</text>
  <rect x="1282" y="570" width="80" height="34" rx="6" fill="#22303a" stroke="#3d5363"/>
  <g color="#afd1ef" class="icon"><use href="#i-undo" x="1295" y="579" width="14" height="14"/></g>
  <text x="1332" y="591" class="label" text-anchor="middle">Undo</text>

  <rect x="750" y="650" width="300" height="124" rx="8" fill="#15181e" stroke="#2c323a"/>
  <g color="#69aeee" class="icon"><use href="#i-undo" x="768" y="669" width="16" height="16"/></g>
  <text x="794" y="680" class="heading">Transaction undone</text>
  <text x="768" y="705" class="body">“Anniversary film” is restored.</text>
  <text x="768" y="723" class="body">The named snapshot was removed.</text>
  <text x="768" y="749" class="value">tx_A71K · Revision 20</text>
  <text x="1026" y="749" fill="#99c9f1" font-size="9" text-anchor="end">Redo</text>

  <rect x="1062" y="650" width="320" height="124" rx="8" fill="#1a1815" stroke="#4a3d26"/>
  <g color="#e8b85d" class="icon"><use href="#i-clock" x="1080" y="669" width="16" height="16"/></g>
  <text x="1106" y="680" class="heading">Recoverable draft found</text>
  <text x="1080" y="705" class="body">Autosave stopped before revision 21 became durable.</text>
  <text x="1080" y="723" class="body">Revision 20 remains safe and can be opened now.</text>
  <rect x="1238" y="734" width="124" height="28" rx="6" fill="#2a261c" stroke="#5a492b"/>
  <text x="1300" y="752" fill="#e7bd68" font-size="9" font-weight="620" text-anchor="middle">Review recovery</text>

  <!-- Acceptance footer -->
  <rect x="40" y="818" width="1360" height="50" rx="8" fill="#111318" stroke="#292d35"/>
  <text x="60" y="839" class="micro">VISIBLE + SEMANTIC FEEDBACK</text>
  <text x="60" y="856" class="meta">Stable polite status region</text>
  <text x="292" y="856" class="meta">Focus restored after sheets</text>
  <text x="524" y="856" class="meta">Apply and Reject stay keyboard reachable</text>
  <text x="824" y="856" class="meta">Reduced motion keeps a static outline</text>
  <text x="1094" y="856" class="meta">No fake progress</text>
  <text x="1380" y="856" class="meta" text-anchor="end">Every result names revision + transaction</text>
</svg>
