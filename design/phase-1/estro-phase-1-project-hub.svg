<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">Estro Phase 1 Project Hub</title>
  <desc id="description">A detailed dark interface design for Estro's local Project Hub, showing recent and recoverable projects, save state, project details, transaction history, WebMCP availability, and undo feedback.</desc>

  <defs>
    <linearGradient id="agent-edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#56a8ff"/>
      <stop offset="0.58" stop-color="#747df4"/>
      <stop offset="1" stop-color="#a17df2"/>
    </linearGradient>
    <linearGradient id="thumb-a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#667e9a"/>
      <stop offset="0.5" stop-color="#c58a77"/>
      <stop offset="1" stop-color="#283743"/>
    </linearGradient>
    <linearGradient id="thumb-b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7d886e"/>
      <stop offset="1" stop-color="#29332f"/>
    </linearGradient>
    <linearGradient id="thumb-c" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b7186"/>
      <stop offset="0.55" stop-color="#b97f72"/>
      <stop offset="1" stop-color="#202c37"/>
    </linearGradient>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-project" viewBox="0 0 24 24"><path d="M4 5h6l2 2h8v12H4z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6l4 2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2.5 20h19zM12 9v5M12 17h.01"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M4 11a8 8 0 1 0 2-5M4 4v7h7"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 3 1.4 5.6L19 10l-5.6 1.4L12 17l-1.4-5.6L5 10l5.6-1.4z"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 7 4 12l5 5M5 12h8a6 6 0 0 1 6 6"/></symbol>
    <symbol id="i-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  </defs>

  <style>
    text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .heading { fill: #f1f3f7; font-size: 14px; font-weight: 620; }
    .label { fill: #e4e7ec; font-size: 11px; font-weight: 560; }
    .body { fill: #adb3be; font-size: 10px; font-weight: 400; }
    .meta { fill: #7f8794; font-size: 9px; font-weight: 500; }
    .micro { fill: #69717e; font-size: 8px; font-weight: 650; letter-spacing: .8px; }
    .value { fill: #aab2bf; font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 9px; font-variant-numeric: tabular-nums; }
    .icon { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .divider { stroke: #292d35; stroke-width: 1; shape-rendering: crispEdges; }
  </style>

  <rect width="1440" height="900" fill="#0d0f13"/>

  <text x="40" y="34" fill="#f5f6f9" font-size="17" font-weight="650" text-anchor="start">Estro</text>
  <text x="40" y="66" fill="#eef1f5" font-size="24" font-weight="620" letter-spacing="-.35" text-anchor="start">Phase 1 · Project foundation</text>
  <text x="40" y="88" class="body" font-size="11" text-anchor="start">Local-first projects, durable state, and visible WebMCP readiness before media-specific editing begins.</text>
  <text x="1400" y="36" class="micro" text-anchor="end">PHASE 1 · DETAILED DESIGN</text>
  <circle cx="1168" cy="76" r="3" fill="#70d2ac"/><text x="1178" y="79" class="meta">IndexedDB durable</text>
  <circle cx="1283" cy="76" r="3" fill="#68adf1"/><text x="1293" y="79" class="meta">WebMCP capable</text>

  <!-- Main viewport -->
  <rect x="40" y="116" width="1360" height="666" rx="10" fill="#111318" stroke="#30343d"/>
  <rect x="40" y="116" width="1360" height="52" rx="10" fill="#15171c"/>
  <rect x="40" y="158" width="1360" height="10" fill="#15171c"/>
  <line x1="40" y1="167.5" x2="1400" y2="167.5" class="divider"/>

  <!-- Top bar -->
  <text x="60" y="148" fill="#f4f6f8" font-size="15" font-weight="650">Estro</text>
  <rect x="480" y="126" width="238" height="32" rx="7" fill="#1d2026" stroke="#30353e"/>
  <g color="#7f8794" class="icon"><use href="#i-search" x="492" y="135" width="14" height="14"/></g>
  <text x="515" y="146" class="meta">Search projects</text>
  <rect x="825" y="126" width="206" height="32" rx="16" fill="#1a1d24" stroke="url(#agent-edge)" stroke-width="1.1"/>
  <g color="#78b8fa" class="icon"><use href="#i-spark" x="839" y="135" width="14" height="14"/></g>
  <text x="862" y="146" class="label">WebMCP ready</text><text x="951" y="146" class="meta">7 tools</text>
  <rect x="1251" y="126" width="129" height="32" rx="7" fill="#5ca7ed"/>
  <g color="#0a1520" class="icon"><use href="#i-plus" x="1264" y="135" width="14" height="14"/></g>
  <text x="1330" y="146" fill="#08111c" font-size="10" font-weight="680" text-anchor="middle">New project</text>

  <!-- Sidebar -->
  <rect x="40" y="168" width="208" height="614" fill="#101217"/>
  <line x1="247.5" y1="168" x2="247.5" y2="782" class="divider"/>
  <text x="60" y="204" class="micro">LIBRARY</text>
  <rect x="52" y="218" width="184" height="36" rx="6" fill="#20242b"/>
  <g color="#8fc6fb" class="icon"><use href="#i-project" x="64" y="228" width="16" height="16"/></g>
  <text x="91" y="240" class="label">All projects</text><text x="220" y="240" class="meta" text-anchor="end">3</text>
  <g color="#858d99" class="icon"><use href="#i-clock" x="64" y="270" width="16" height="16"/></g>
  <text x="91" y="282" class="body">Recent</text>
  <g color="#e9b85d" class="icon"><use href="#i-alert" x="64" y="312" width="16" height="16"/></g>
  <text x="91" y="324" class="body">Recoverable</text><text x="220" y="324" fill="#d9a94f" font-size="9" text-anchor="end">1</text>
  <line x1="60" y1="352" x2="228" y2="352" class="divider"/>
  <text x="60" y="382" class="micro">STORAGE</text>
  <g color="#70d2ac" class="icon"><use href="#i-database" x="64" y="396" width="16" height="16"/></g>
  <text x="91" y="408" class="body">Local browser</text>
  <text x="91" y="426" class="meta">24.8 MB used</text>
  <rect x="64" y="441" width="154" height="4" rx="2" fill="#292d35"/><rect x="64" y="441" width="34" height="4" rx="2" fill="#579ddf"/>
  <text x="60" y="744" class="meta">Projects stay on this device.</text>
  <text x="60" y="758" class="meta">Cloud sync is not enabled.</text>

  <!-- Project list -->
  <text x="280" y="216" fill="#f1f3f7" font-size="24" font-weight="620" letter-spacing="-.3">Projects</text>
  <text x="280" y="238" class="body">Continue from a durable local revision.</text>
  <rect x="280" y="260" width="708" height="62" rx="8" fill="#1a1815" stroke="#4a3d26"/>
  <g color="#e8b85d" class="icon"><use href="#i-alert" x="298" y="278" width="18" height="18"/></g>
  <text x="328" y="283" fill="#ebedf1" font-size="11" font-weight="600">Coastal reel has a recoverable draft</text>
  <text x="328" y="302" class="meta">Autosave stopped 9 minutes ago · durable revision 11 is preserved</text>
  <rect x="849" y="274" width="119" height="34" rx="6" fill="#2b261b" stroke="#5a492b"/>
  <text x="908" y="295" fill="#e7bd68" font-size="10" font-weight="600" text-anchor="middle">Review recovery</text>

  <text x="280" y="355" class="micro">RECENT</text>

  <!-- Selected row -->
  <rect x="268" y="370" width="732" height="112" rx="8" fill="#1b2027" stroke="#4f8fca" stroke-width="1.2"/>
  <rect x="284" y="386" width="126" height="80" rx="5" fill="url(#thumb-a)"/>
  <path d="M284 444c28-17 54-14 78-4 18 8 31 4 48-8v34H284z" fill="#22323d" opacity=".9"/>
  <text x="430" y="407" fill="#f0f2f5" font-size="14" font-weight="620">Anniversary film</text>
  <text x="430" y="429" class="body">Video project · edited 3 minutes ago</text>
  <g color="#70d2ac" class="icon"><use href="#i-check" x="430" y="444" width="13" height="13"/></g>
  <text x="450" y="454" fill="#8fdabc" font-size="9">Saved · Revision 18</text>
  <text x="908" y="405" class="value" text-anchor="end">LOCAL · 12.4 MB</text>
  <rect x="917" y="430" width="35" height="30" rx="6" fill="#252932"/>
  <g color="#9ba3af" class="icon"><use href="#i-more" x="927" y="437" width="15" height="15"/></g>
  <g color="#69717d" class="icon"><use href="#i-chevron" x="960" y="435" width="18" height="18"/></g>

  <!-- Other rows -->
  <rect x="280" y="496" width="708" height="88" rx="8" fill="#15181e" stroke="#292e36"/>
  <rect x="296" y="510" width="98" height="60" rx="5" fill="url(#thumb-b)"/>
  <text x="414" y="529" class="heading">Portrait study</text>
  <text x="414" y="549" class="body">Photo project · edited yesterday</text>
  <circle cx="887" cy="530" r="3" fill="#68adf1"/><text x="900" y="533" class="meta">Local</text>
  <g color="#69717d" class="icon"><use href="#i-chevron" x="956" y="521" width="18" height="18"/></g>

  <rect x="280" y="596" width="708" height="88" rx="8" fill="#15181e" stroke="#292e36"/>
  <rect x="296" y="610" width="98" height="60" rx="5" fill="url(#thumb-c)"/>
  <text x="414" y="629" class="heading">Coastal reel</text>
  <text x="414" y="649" class="body">Video project · autosave interrupted</text>
  <circle cx="846" cy="630" r="3" fill="#e9b85d"/><text x="858" y="633" fill="#dab66f" font-size="9">Recovery available</text>
  <g color="#69717d" class="icon"><use href="#i-chevron" x="956" y="621" width="18" height="18"/></g>

  <!-- Detail rail -->
  <rect x="1028" y="168" width="372" height="614" fill="#121419"/>
  <line x1="1028.5" y1="168" x2="1028.5" y2="782" class="divider"/>
  <text x="1056" y="205" class="micro">SELECTED PROJECT</text>
  <text x="1056" y="235" fill="#f2f4f7" font-size="18" font-weight="620">Anniversary film</text>
  <text x="1056" y="256" class="value">project_7H2K · schema 1</text>

  <text x="1056" y="300" class="micro">DURABILITY</text>
  <g color="#70d2ac" class="icon"><use href="#i-check" x="1056" y="316" width="15" height="15"/></g>
  <text x="1080" y="328" class="label">All changes saved</text>
  <text x="1080" y="346" class="meta">Revision 18 · 3 minutes ago</text>
  <text x="1056" y="378" class="body">Autosave</text><text x="1368" y="378" class="label" text-anchor="end">On</text>
  <text x="1056" y="402" class="body">Named snapshot</text><text x="1368" y="402" class="label" text-anchor="end">Before color pass</text>
  <text x="1056" y="426" class="body">Storage</text><text x="1368" y="426" class="label" text-anchor="end">This browser</text>

  <line x1="1056" y1="454" x2="1372" y2="454" class="divider"/>
  <text x="1056" y="484" class="micro">RECENT ACTIVITY</text>
  <rect x="1056" y="500" width="316" height="104" rx="8" fill="#18201e" stroke="#315147"/>
  <g color="#70d2ac" class="icon"><use href="#i-check" x="1072" y="517" width="16" height="16"/></g>
  <text x="1098" y="528" class="heading">Project renamed</text>
  <text x="1098" y="547" class="body">“Anniversary” → “Anniversary film”</text>
  <text x="1072" y="574" class="value">tx_8N4P · Revision 18 · You</text>
  <rect x="1288" y="558" width="68" height="30" rx="6" fill="#222a32" stroke="#384654"/>
  <g color="#a9c9e8" class="icon"><use href="#i-undo" x="1300" y="566" width="13" height="13"/></g>
  <text x="1333" y="577" class="label" text-anchor="middle">Undo</text>

  <text x="1056" y="640" class="micro">ACTIONS</text>
  <rect x="1056" y="656" width="152" height="36" rx="6" fill="#22262d" stroke="#343a43"/>
  <text x="1132" y="678" class="label" text-anchor="middle">Open project</text>
  <rect x="1220" y="656" width="152" height="36" rx="6" fill="#1a1d23" stroke="#30353e"/>
  <text x="1296" y="678" class="label" text-anchor="middle">Create snapshot</text>
  <text x="1056" y="726" class="meta">Delete remains inside the actions menu and</text>
  <text x="1056" y="742" class="meta">always opens a consequence-focused confirmation.</text>

  <!-- Bottom acceptance strip -->
  <rect x="40" y="808" width="1360" height="58" rx="8" fill="#111318" stroke="#292d35"/>
  <text x="60" y="833" class="micro">IMPLEMENTATION CONTRACT</text>
  <g color="#70d2ac" class="icon"><use href="#i-check" x="60" y="842" width="13" height="13"/></g><text x="80" y="852" class="meta">One visible primary action</text>
  <g color="#70d2ac" class="icon"><use href="#i-check" x="280" y="842" width="13" height="13"/></g><text x="300" y="852" class="meta">40px desktop targets</text>
  <g color="#70d2ac" class="icon"><use href="#i-check" x="486" y="842" width="13" height="13"/></g><text x="506" y="852" class="meta">Stable keyboard order + 2px focus</text>
  <g color="#70d2ac" class="icon"><use href="#i-check" x="760" y="842" width="13" height="13"/></g><text x="780" y="852" class="meta">Status uses icon + text</text>
  <g color="#70d2ac" class="icon"><use href="#i-check" x="990" y="842" width="13" height="13"/></g><text x="1010" y="852" class="meta">Project Hub reflows at 320px</text>
  <text x="1380" y="852" class="meta" text-anchor="end">Primary viewport · 1440×900</text>
</svg>
